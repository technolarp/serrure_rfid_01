; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:d1_mini_pro]
platform = espressif8266
board = d1_mini_pro
framework = arduino
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.8m7m.ld
monitor_speed = 115200
lib_deps = 
	fastled/FastLED@^3.9.16
	bblanchon/ArduinoJson@^7.4.1
	https://github.com/me-no-dev/ESPAsyncTCP.git
	https://github.com/me-no-dev/ESPAsyncWebServer.git
    https://github.com/don/NDEF.git
	https://github.com/technolarp/technolarp_fastled.git
	https://github.com/technolarp/technolarp_buzzer.git
    https://github.com/technolarp/technolarp_pn532.git
	

